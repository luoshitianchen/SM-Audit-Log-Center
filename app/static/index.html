<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Audit Log Center</title><style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;background:#07111f;color:#e8f0ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#102a43)}.shell{max-width:1180px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #214668;padding-bottom:16px}.brand{letter-spacing:.18em;color:#79b8ff;font-size:13px}.pill{border:1px solid #2f5f89;border-radius:99px;padding:8px 13px;color:#8ff0c8}.hero{padding:34px 0}.hero h1{font-size:38px;margin:0 0 10px}.lead{color:#a9bdd6;line-height:1.7;max-width:760px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.metric,.card{background:#0d1f34;border:1px solid #1f4363;border-radius:14px;padding:18px;box-shadow:0 18px 40px #0004}.metric small{color:#8aa4c0}.metric strong{display:block;font-size:28px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card h3{margin:0 0 8px}.muted{color:#91a8c1}.badge{display:inline-block;margin-top:8px;background:#123d68;color:#9fd0ff;padding:5px 9px;border-radius:99px;font-size:12px}.foot{margin-top:24px;color:#6f89a6;font-size:13px}@media(max-width:760px){.metrics{grid-template-columns:1fr}.top{display:block}.pill{display:inline-block;margin-top:10px}}</style></head><body><main class="shell"><header class="top"><div class="brand">SM ENTERPRISE SUITE</div><div id="health" class="pill">检测中</div></header><section class="hero"><h1>SM Audit Log Center</h1><p class="lead">统一审计与日志中心：操作审计、日志检索、异常行为检测与合规报表。内置健康探针、运维指标、安全响应头、Docker 部署和 CI 安全流水线，可作为大企业平台化项目基线。</p></section><section class="metrics"><div class="metric"><small>资源总数</small><strong id="total">-</strong></div><div class="metric"><small>活跃资源</small><strong id="active">-</strong></div><div class="metric"><small>服务版本</small><strong id="version">-</strong></div></section><section class="grid" id="items"></section><div class="foot">接口：/health · /readyz · /api/overview · /api/ops/metrics</div></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const h=await fetch('/health').then(r=>r.json()),o=await fetch('/api/overview').then(r=>r.json());document.querySelector('#health').textContent='服务正常';document.querySelector('#total').textContent=o.total;document.querySelector('#active').textContent=o.active;document.querySelector('#version').textContent=h.version;document.querySelector('#items').innerHTML=o.items.map(i=>`<article class="card"><h3>${esc(i.name)}</h3><div class="muted">负责人：${esc(i.owner)} · 等级：${esc(i.priority)}</div><span class="badge">${esc(i.status)}</span></article>`).join('')}catch(e){document.querySelector('#health').textContent='服务异常'}}load();setInterval(load,15000)</script></body></html>
