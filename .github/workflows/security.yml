name: Security
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pip-audit bandit ruff cyclonedx-bom
      - run: pip install -r requirements.txt
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r app -x tests
      - run: ruff check app tests
      - run: cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
