[project]
name = "SM-Audit-Log-Center"
version = "2.0.0"
description = "统一审计与日志中心：事件接入、检索、SM3 完整性链与合规报表"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
