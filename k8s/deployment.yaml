apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-audit-log-center
  namespace: sm
  labels:
    app: sm-audit-log-center
    platform: sm-suite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sm-audit-log-center
  template:
    metadata:
      labels:
        app: sm-audit-log-center
        platform: sm-suite
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/luoshitianchen/sm-audit-log-center:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8320
          protocol: TCP
        env:
        - name: SM_ENV
          value: production
        - name: SM_ALLOWED_HOSTS
          value: sm-audit-log-center,localhost,127.0.0.1
        - name: SM_DATABASE_PATH
          value: /data/service.db
        - name: SM_INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: sm-secrets
              key: internal_api_key
        - name: SM4_KEY_HEX
          valueFrom:
            secretKeyRef:
              name: sm-secrets
              key: sm4_key_hex
        - name: SM_AUDIT_CENTER_URL
          value: http://sm-audit-log-center:8320
        - name: SM_NOTIFICATION_CENTER_URL
          value: http://sm-notification-center:8470
        - name: SM_ALERT_KNOWN_SERVICES
          value: sm-api-gateway,sm-iam,sm-audit-log-center,sm-observability,sm-devsecops,sm-workflow-approval,sm-data-governance,sm-service-desk,sm-cmdb,sm-agentops,sm-config-kms,sm-event-bus,sm-object-storage,sm-backup-dr,sm-api-developer-portal,sm-mdm,sm-soc,sm-notification-center,sm-data-exchange,sm-hr,sm-crm,sm-finance,sm-procurement,sm-legal-contract,sm-release-center,sm-erp,sm-knowledge-bot,sm-fusion-platform
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sm-audit-log-center-data
      - name: tmp
        emptyDir: {}
